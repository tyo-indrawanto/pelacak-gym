<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelacak Gym</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #4ade80;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cccccc;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2c2c2c;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #4ade80;
        }

        /* Memastikan tombol selalu dapat diklik dan berada di lapisan teratas */
        button {
            position: relative;
            z-index: 10;
            pointer-events: auto;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-tambah {
            width: 100%;
            padding: 14px;
            background-color: #4ade80;
            color: #121212;
            font-size: 16px;
            margin-top: 10px;
        }

        .btn-tambah:hover {
            background-color: #22c55e;
        }

        .daftar-latihan {
            margin-top: 25px;
            list-style: none;
        }

        .item-latihan {
            background-color: #2c2c2c;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-latihan h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .info-latihan p {
            font-size: 13px;
            color: #aaaaaa;
        }

        .btn-hapus {
            background-color: #ef4444;
            color: white;
            padding: 8px 12px;
            font-size: 13px;
        }

        .btn-hapus:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pelacak Gym</h1>
    
    <form id="form-gym">
        <div class="form-group">
            <label for="nama-latihan">Nama Latihan</label>
            <input type="text" id="nama-latihan" placeholder="Contoh: Bench Press, Squat" required>
        </div>
        <div class="form-group">
            <label for="beban">Beban (kg)</label>
            <input type="number" id="beban" placeholder="Contoh: 40" min="0" required>
        </div>
        <div class="form-group">
            <label for="set-rep">Set & Repetisi</label>
            <input type="text" id="set-rep" placeholder="Contoh: 3 Set x 12 Rep" required>
        </div>
        
        <button type="submit" id="tombol-simpan" class="btn-tambah">Tambah Latihan</button>
    </form>

    <ul id="daftar-latihan" class="daftar-latihan"></ul>
</div>

<script>
    // Memastikan seluruh elemen HTML sudah dimuat sebelum menjalankan skrip
    document.addEventListener('DOMContentLoaded', () => {
        const formGym = document.getElementById('form-gym');
        const daftarLatihan = document.getElementById('daftar-latihan');
        
        // Mengambil data tersimpan dari LocalStorage jika ada
        let dataLatihan = JSON.parse(localStorage.getItem('pelacakGym')) || [];

        function renderDaftar() {
            daftarLatihan.innerHTML = '';
            dataLatihan.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'item-latihan';
                li.innerHTML = `
                    <div class="info-latihan">
                        <h3>${item.nama}</h3>
                        <p>Beban: ${item.beban} kg | ${item.setRep}</p>
                    </div>
                    <button type="button" class="btn-hapus" data-index="${index}">Hapus</button>
                `;
                daftarLatihan.appendChild(li);
            });
        }

        // Menangani klik tombol simpan melalui submit form
        formGym.addEventListener('submit', (e) => {
            e.preventDefault(); // Mencegah halaman reload

            const nama = document.getElementById('nama-latihan').value.trim();
            const beban = document.getElementById('beban').value;
            const setRep = document.getElementById('set-rep').value.trim();

            if (nama && beban !== '' && setRep) {
                dataLatihan.push({ nama, beban, setRep });
                localStorage.setItem('pelacakGym', JSON.stringify(dataLatihan));
                renderDaftar();
                formGym.reset();
            }
        });

        // Event delegation untuk tombol hapus agar tombol yang baru dibuat tetap bisa diklik
        daftarLatihan.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-hapus')) {
                const index = e.target.getAttribute('data-index');
                dataLatihan.splice(index, 1);
                localStorage.setItem('pelacakGym', JSON.stringify(dataLatihan));
                renderDaftar();
            }
        });

        // Tampilkan data saat pertama kali dibuka
        renderDaftar();
    });
</script>

</body>
</html>
